apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llmops-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmops-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: llmops-gateway
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: llmops-gateway-config
          env:
            # Secrets are created out-of-band (never committed); see README.
            - name: GATEWAY_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: llmops-gateway-secrets
                  key: GATEWAY_API_KEYS
                  optional: true
            - name: UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llmops-gateway-secrets
                  key: UPSTREAM_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
