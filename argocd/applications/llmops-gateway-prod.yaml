apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llmops-gateway-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PedroCastro0507/llmops-gateway.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
