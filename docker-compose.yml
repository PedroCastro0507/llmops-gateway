# Local stack: gateway + Ollama (real local LLM) + Prometheus + Grafana.
#   docker compose up -d --build
#   docker compose exec ollama ollama pull llama3.2:1b
services:
  gateway:
    build: .
    environment:
      BACKEND: openai
      UPSTREAM_BASE_URL: http://ollama:11434/v1
      DEFAULT_MODEL: llama3.2:1b
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-local-dev-key}
    ports: ["8000:8000"]
    read_only: true
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:0.6.2
    volumes: ["ollama:/root/.ollama"]
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
volumes:
  ollama: {}
