name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt pip-audit==2.10.1
      - name: Lint and format check (ruff, incl. bandit security rules)
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Audit Python dependencies for known CVEs
        run: pip-audit -r requirements.txt

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Render overlays and validate against Kubernetes schemas
        run: |
          for env in dev prod; do
            echo "::group::$env"
            kubectl kustomize k8s/overlays/$env | kubeconform -strict -summary -
            echo "::endgroup::"
          done
      - name: Validate Argo CD Applications
        run: kubeconform -strict -summary -ignore-missing-schemas argocd/applications/

  image:
    name: Build, scan and publish image
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Trivy scan (report HIGH and CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$IMAGE:${{ github.sha }}"
      - name: Trivy gate (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"
      - name: Smoke test the container (read-only, non-root)
        run: |
          docker run -d --rm --read-only --name gw -p 8000:8000 -e GATEWAY_API_KEYS=ci "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs -X POST localhost:8000/v1/chat/completions \
            -H 'Authorization: Bearer ci' -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"smoke"}]}'
          test "$(docker exec gw id -u)" = "10001"
          docker stop gw
      - name: Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
